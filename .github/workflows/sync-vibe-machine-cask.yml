name: Sync Vibe Machine cask

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: sync-vibe-machine-cask
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Synchronize from the latest GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/sync-vibe-machine-cask.sh

      - name: Validate cask syntax
        run: ruby -c Casks/vibe-machine.rb

      - name: Open, verify, and merge a release update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- Casks/vibe-machine.rb; then
            echo "Cask already current"
            exit 0
          fi

          version=$(awk -F '"' '/^  version / { print $2 }' Casks/vibe-machine.rb)
          branch="automation/vibe-machine-cask"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add Casks/vibe-machine.rb
          git commit -m "chore: bump vibe-machine to $version"
          git fetch origin "$branch" || true
          git push --force-with-lease origin "HEAD:$branch"

          pr_number=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr_number" ]; then
            pr_url=$(gh pr create \
              --base master \
              --head "$branch" \
              --title "chore: bump vibe-machine to $version" \
              --body "Automated Homebrew cask sync from the provider-digested GitHub release asset.")
            pr_number=${pr_url##*/}
          fi

          head_sha=$(git rev-parse HEAD)
          gh workflow run ci.yml --ref "$branch"
          run_id=""
          for _ in {1..20}; do
            run_id=$(gh run list \
              --workflow ci.yml \
              --branch "$branch" \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$head_sha\") | .databaseId" \
              | head -1)
            [ -n "$run_id" ] && break
            sleep 3
          done

          if [ -z "$run_id" ]; then
            echo "Dispatched CI run was not observable" >&2
            exit 1
          fi

          gh run watch "$run_id" --exit-status
          gh pr merge "$pr_number" --squash --delete-branch
